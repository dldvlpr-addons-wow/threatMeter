name: Release

# Pousser un tag (ex. 1.2.0) construit le zip avec le packager BigWigs et le
# publie sur CurseForge, Wago et en release GitHub.
# Secrets du dépôt : CF_API_KEY, WAGO_API_TOKEN (GITHUB_TOKEN est fourni).
# Identifiants de projet dans le .toc : ## X-Curse-Project-ID et ## X-Wago-ID.
# Une plateforme sans secret ou sans identifiant est ignorée.
# Discord : DISCORD_RELEASE_WEBHOOK reçoit l'annonce, DISCORD_CHANGELOG_WEBHOOK la section
# du CHANGELOG.md pour la version (## x.y.z). Secrets du dépôt obligatoires : une variable
# afficherait l'URL du webhook en clair dans le log. Absent = ignoré, échec d'envoi = warning.

on:
  push:
    tags: ["*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2

      - name: Annonce Discord
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          title="ForeverMeter $version"
          curseforge="https://www.curseforge.com/wow/addons/forever-meter"
          wago="https://addons.wago.io/addons/forever-details-meter-threat-damage-healing-and-more"
          links="CurseForge: $curseforge"$'\n'"Wago: $wago"
          post() { curl -sS --fail-with-body -H "Content-Type: application/json" -d @- "$1"; }

          if [ -n "$RELEASE_WEBHOOK" ]; then
            jq -n --arg content "**$title** is out"$'\n'"$links" '{content: $content}' | post "$RELEASE_WEBHOOK" \
              || echo "::warning::Échec de l'annonce Discord"
          else
            echo "::warning::DISCORD_RELEASE_WEBHOOK absent, annonce de release ignorée"
          fi

          notes=$(awk -v h="## $version" '$0 == h {f=1; next} f && /^## /{exit} f' CHANGELOG.md)
          if [ -z "$CHANGELOG_WEBHOOK" ]; then
            echo "::warning::DISCORD_CHANGELOG_WEBHOOK absent, changelog ignoré"
          elif [ -z "$notes" ]; then
            echo "::warning::Pas de section \"## $version\" dans CHANGELOG.md, changelog ignoré"
          else
            jq -n --arg title "$title" --arg url "$curseforge" --arg notes "$notes" --arg links "$links" \
              '{embeds: [{title: $title, url: $url, description: ($notes[:3900] + "\n\n" + $links)}]}' | post "$CHANGELOG_WEBHOOK" \
              || echo "::warning::Échec de l'envoi du changelog Discord"
          fi
