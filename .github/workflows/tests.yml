name: Tests

# Tests hors jeu (logique pure, locales, client simulé) à chaque push sur main et sur chaque pull request.
# Même commande que l'étape « Tests hors jeu » de release.yml.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests hors jeu
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.1
          lua5.1 selfcheck.lua
          lua5.1 uicheck.lua
